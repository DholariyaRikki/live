name: 24/7 Standalone Live APMC MongoDB Sync

on:
  schedule:
    # Run every 2 hours (12 times a day, completely free)
    # - cron: '0 */2 * * *'
    - cron: '*/10 * * * *'
  workflow_dispatch:
    # Allows manual trigger via GitHub Actions UI

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -d "live" ]; then
          pip install -r live/requirements.txt
        else
          pip install -r requirements.txt
        fi

    - name: Run Standalone Sync
      env:
        MONGO_URI: ${{ secrets.MONGO_URI }}
        MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME }}
        MONGO_COLLECTION_NAME: ${{ secrets.MONGO_COLLECTION_NAME }}
      run: |
        if [ -d "live" ]; then
          python live/sync_mongo.py
        else
          python sync_mongo.py
        fi
